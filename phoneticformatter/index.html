<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phonetic Formatter</title>
    <meta name="robots" content="index, follow">
    <meta name="description" content="Phonetic Formatter — language hub for legal and support pages.">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 36rem; margin: 3rem auto; padding: 0 1rem; line-height: 1.6; color: #333; }
        h1 { font-size: 1.35rem; margin-bottom: 1rem; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { margin: 0.5rem 0; }
        a { color: #2563eb; text-decoration: none; }
        a:hover { text-decoration: underline; }
        p { color: #666; font-size: 0.95rem; margin-top: 1.5rem; }
    </style>
</head>
<body>
    <h1>Phonetic Formatter</h1>
    <p>Marketing pages (flat filenames):</p>
    <ul>
        <li><a href="index.html" hreflang="en">English</a> (this file — replace with full landing if needed)</li>
        <li><a href="index-de.html" hreflang="de">Deutsch</a></li>
        <li><a href="index-fr.html" hreflang="fr">Français</a></li>
        <li><a href="index-es.html" hreflang="es">Español</a></li>
        <li><a href="index-zh.html" hreflang="zh-Hans">简体中文</a></li>
    </ul>
    <p>Legal &amp; support (same naming pattern): <a href="privacy.html">privacy</a>, <a href="terms.html">terms</a>, <a href="support.html">support</a> + <code>-de</code> / <code>-fr</code> / <code>-es</code> / <code>-zh</code> suffixes.</p>
</body>
</html>
