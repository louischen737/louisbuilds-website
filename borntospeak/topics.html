          <img src="./assets/logo-64.webp" alt="" width="64" height="64" class="h-full w-full object-cover" decoding="async" />

          <a data-i18n-nav="practice" href="./board-games.html" class="rounded-lg border border-slate-200 bg-white px-2.5 py-1.5 text-[13px] font-bold text-slate-600 hover:bg-slate-50 sm:px-3">Games</a>

      <nav class="flex flex-col gap-2" aria-label="Mobile menu">
        <a data-i18n-nav="home" href="./index.html" class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-bold text-slate-800">Home</a>
        <a data-i18n-nav="practice" href="./board-games.html" class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm font-bold text-slate-800">Games</a>
        <span data-i18n-nav="thinking" class="rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm font-bold text-amber-900">Topics</span>

  <div class="mx-auto max-w-5xl px-4 pb-20 md:px-6">
    <main class="pt-10">
      <h1 id="page-title" class="text-3xl font-black text-slate-900 md:text-4xl">English corner topics</h1>
      <p id="page-desc" class="mt-2 max-w-2xl text-base font-semibold text-slate-600"></p>

      <div id="toolbar" class="mt-8 hidden space-y-4">
        <div class="flex flex-col gap-4 lg:flex-row lg:items-end lg:gap-6">
          <div class="min-w-0 flex-1 lg:max-w-md">
            <label id="search-label" for="topic-search" class="mb-1.5 block text-[11px] font-extrabold uppercase tracking-widest text-slate-500"></label>
            <input
              id="topic-search"
              type="search"
              name="q"
              inputmode="search"
              autocomplete="off"
              class="w-full rounded-2xl border-2 border-slate-200 bg-white px-4 py-2.5 text-sm font-semibold text-slate-800 shadow-sm placeholder:text-slate-400 focus:border-duo-green focus:outline-none focus:ring-2 focus:ring-duo-soft"
            />
          </div>
          <div class="min-w-0 flex-1">
            <label id="cat-label" class="mb-1.5 block text-[11px] font-extrabold uppercase tracking-widest text-slate-500"></label>
            <div id="cat-pills" class="flex flex-wrap gap-2"></div>
          </div>
        </div>
        <p id="result-count" class="text-sm font-bold text-slate-500" aria-live="polite"></p>
      </div>

      <div id="loading" class="mt-10 rounded-2xl border-2 border-dashed border-slate-200 bg-white p-8 text-center font-bold text-slate-500">
        …
      </div>
      <div id="error" class="hidden mt-10 rounded-2xl border-2 border-red-200 bg-red-50 p-6 text-center font-semibold text-red-800"></div>

      <div id="empty-filter" class="hidden mt-8 rounded-2xl border-2 border-dashed border-amber-200 bg-amber-50/80 p-8 text-center font-bold text-amber-950"></div>

      <div id="list" class="mt-6 hidden space-y-3"></div>
    </main>
  </div>

  <footer class="border-t-2 border-slate-200 bg-white py-8 text-center">
    <p id="footer-line" class="text-xs font-extrabold uppercase tracking-widest text-slate-400">Born To Speak · Discussion archive</p>
  </footer>

  <script>
    var params = new URLSearchParams(window.location.search);
    var lang = params.get('lang') === 'zh' ? 'zh' : 'en';

    var CAT_LABEL = {
      life: { en: 'Life & daily', zh: '生活与日常' },
      work: { en: 'Work & career', zh: '职场与成长' },
      travel: { en: 'Travel & city', zh: '旅行与城市' },
      tech: { en: 'Tech & life', zh: '科技与日常' },
      culture: { en: 'Society & culture', zh: '社会与文化' },
      self: { en: 'Mind & self', zh: '心理与自我' },
      media: { en: 'Media & spend', zh: '内容与消费' }
    };

    var CAT_ORDER = ['life', 'work', 'travel', 'tech', 'culture', 'self', 'media'];

    var filterCat = params.get('cat') || 'all';
    var filterQ = params.get('q') || '';
    var allTopics = [];
    var activeCat = filterCat;

    function qsForLang(nextLang) {
      var p = new URLSearchParams();
      p.set('lang', nextLang);
      if (activeCat && activeCat !== 'all') p.set('cat', activeCat);
      var qv = (document.getElementById('topic-search') && document.getElementById('topic-search').value) || filterQ || '';
      if (qv.trim()) p.set('q', qv.trim());
      var s = p.toString();
      return s ? '?' + s : '';
    }

    function syncURL() {
      var p = new URLSearchParams();
      p.set('lang', lang);
      if (activeCat && activeCat !== 'all') p.set('cat', activeCat);
      var qv = document.getElementById('topic-search') ? document.getElementById('topic-search').value.trim() : '';
      if (qv) p.set('q', qv);
      var query = p.toString();
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', query ? './topics.html?' + query : './topics.html');
      }
      updateLangSwitcher();
    }

    function updateLangSwitcher() {
      var en = document.getElementById('lang-link-en');
      var zh = document.getElementById('lang-link-zh');
      if (!en || !zh) return;
      var base = './topics.html';
      en.href = base + qsForLang('en');
      zh.href = base + qsForLang('zh');
      var on = 'rounded-md bg-white px-2.5 py-1 text-slate-900 shadow-sm';
      var off = 'rounded-md px-2.5 py-1 text-slate-600 hover:bg-white hover:text-slate-900';
      if (lang === 'zh') {
        en.className = off;
        zh.className = on;
        en.removeAttribute('aria-current');
        zh.setAttribute('aria-current', 'true');
      } else {
        en.className = on;
        zh.className = off;
        en.setAttribute('aria-current', 'true');
        zh.removeAttribute('aria-current');
      }
    }

    function applyNavSiteLinks() {
      var zh = lang === 'zh';
      var home = zh ? './index-zh.html' : './index.html';
      var games = zh ? './board-games-zh.html' : './board-games.html';
      var topicsSelf = zh ? './topics.html?lang=zh' : './topics.html';
      var work = zh ? './work-zh.html' : './work.html';
      var tools = zh ? './tools-zh.html' : './tools.html';
      document.querySelectorAll('[data-i18n-nav="home"]').forEach(function (el) {
        if (el.tagName === 'A') el.setAttribute('href', home);
      });
      document.querySelectorAll('[data-i18n-nav="practice"]').forEach(function (el) {
        if (el.tagName === 'A') el.setAttribute('href', games);
      });
      document.querySelectorAll('[data-i18n-nav="thinking"]').forEach(function (el) {
        if (el.tagName === 'A') el.setAttribute('href', topicsSelf);
      });
      document.querySelectorAll('[data-i18n-nav="work"]').forEach(function (el) {
        if (el.tagName === 'A') el.setAttribute('href', work);
      });
      document.querySelectorAll('[data-i18n-nav="tools"]').forEach(function (el) {
        if (el.tagName === 'A') el.setAttribute('href', tools);
      });
      var logo = document.getElementById('bts-logo-link');
      if (logo) logo.setAttribute('href', home);
    }

    function escapeHtml(s) {
      if (s == null) return '';
      var el = document.createElement('div');
      el.textContent = s;
      return el.innerHTML;
    }

    function norm(s) {
      return (s == null ? '' : String(s)).toLowerCase();
    }

    function topicMatchesSearch(t, needle) {
      if (!needle) return true;
      var n = norm(needle);
      if (n === String(t.id)) return true;
      var c = t.category || 'life';
      var extra = [];
      if (CAT_LABEL[c]) {
        extra.push(CAT_LABEL[c].en, CAT_LABEL[c].zh);
      }
      var hay = [t.zh_title, t.en_title, t.intro_zh, t.intro_en, c].concat(extra).map(norm).join(' ');
      return hay.indexOf(n) !== -1;
    }

    function buildCategoryList(topics) {
      var counts = {};
      topics.forEach(function (t) {
        var c = t.category || 'life';
        counts[c] = (counts[c] || 0) + 1;
      });
      var out = [];
      CAT_ORDER.forEach(function (c) {
        if (counts[c]) out.push(c);
      });
      Object.keys(counts).forEach(function (c) {
        if (out.indexOf(c) === -1) out.push(c);
      });
      return out;
    }

    function renderTopicCard(t) {
      var list = document.getElementById('list');
      var q = 'lang=' + encodeURIComponent(lang);
      var a = document.createElement('a');
      a.href = './topic.html?id=' + encodeURIComponent(t.id) + '&' + q;
      a.className =
        'flex flex-col gap-2 rounded-2xl border-2 border-slate-200 bg-white p-5 shadow-[0_2px_12px_rgba(0,0,0,.06)] transition hover:border-amber-400/70 hover:shadow-lg sm:flex-row sm:items-center sm:justify-between sm:gap-6';

      var catSlug = t.category || 'life';
      var catLab = CAT_LABEL[catSlug] ? CAT_LABEL[catSlug][lang === 'zh' ? 'zh' : 'en'] : catSlug;
      var titleEn = t.en_title || '';
      var inner;
      var pill =
        '<span class="mb-2 inline-flex w-fit rounded-lg bg-slate-100 px-2 py-0.5 text-[11px] font-extrabold uppercase tracking-wide text-slate-600">' +
        escapeHtml(catLab) +
        '</span>';
      if (lang === 'zh') {
        inner =
          '<div class="min-w-0 flex-1">' +
          pill +
          '<h2 class="text-lg font-black text-slate-900 leading-snug">' +
          escapeHtml(t.zh_title) +
          '</h2>' +
          '<p class="mt-1 text-sm font-semibold leading-relaxed text-slate-600">' +
          escapeHtml(titleEn) +
          '</p></div>';
      } else {
        inner =
          '<div class="min-w-0 flex-1">' +
          pill +
          '<h2 class="text-lg font-black text-slate-900 leading-snug">' +
          escapeHtml(titleEn) +
          '</h2></div>';
      }
      a.innerHTML = inner + '<span class="shrink-0 text-sm font-black text-duo-green">→</span>';
      list.appendChild(a);
    }

    function setPillStyles(btn, on) {
      if (on) {
        btn.className =
          'rounded-2xl border-2 border-duo-green bg-duo-soft px-3 py-1.5 text-xs font-extrabold text-duo-green-dark shadow-sm';
      } else {
        btn.className =
          'rounded-2xl border-2 border-slate-200 bg-white px-3 py-1.5 text-xs font-extrabold text-slate-600 hover:border-slate-300';
      }
    }

    function applyFilters() {
      var qv = document.getElementById('topic-search').value.trim();
      var list = document.getElementById('list');
      var emptyEl = document.getElementById('empty-filter');
      var countEl = document.getElementById('result-count');

      list.innerHTML = '';

      var filtered = allTopics.filter(function (t) {
        var c = t.category || 'life';
        if (activeCat !== 'all' && c !== activeCat) return false;
        return topicMatchesSearch(t, qv);
      });

      filtered.forEach(renderTopicCard);

      if (lang === 'zh') {
        countEl.textContent = '共 ' + filtered.length + ' 条（共 ' + allTopics.length + ' 条话题）';
      } else {
        countEl.textContent = filtered.length + ' of ' + allTopics.length + ' topics';
      }

      if (filtered.length === 0) {
        emptyEl.classList.remove('hidden');
        list.classList.add('hidden');
      } else {
        emptyEl.classList.add('hidden');
        list.classList.remove('hidden');
      }

      syncURL();
    }

    function renderCategoryPills(categories) {
      var wrap = document.getElementById('cat-pills');
      wrap.innerHTML = '';
      var allLabel = lang === 'zh' ? '全部' : 'All';
      var allBtn = document.createElement('button');
      allBtn.type = 'button';
      allBtn.setAttribute('aria-pressed', activeCat === 'all' ? 'true' : 'false');
      allBtn.textContent = allLabel;
      setPillStyles(allBtn, activeCat === 'all');
      allBtn.addEventListener('click', function () {
        activeCat = 'all';
        wrap.querySelectorAll('button').forEach(function (b) {
          var on = b === allBtn;
          setPillStyles(b, on);
          b.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
        applyFilters();
      });
      wrap.appendChild(allBtn);

      categories.forEach(function (slug) {
        var btn = document.createElement('button');
        btn.type = 'button';
        var lab = CAT_LABEL[slug] ? CAT_LABEL[slug][lang === 'zh' ? 'zh' : 'en'] : slug;
        btn.textContent = lab;
        btn.setAttribute('aria-pressed', activeCat === slug ? 'true' : 'false');
        setPillStyles(btn, activeCat === slug);
        btn.addEventListener('click', function () {
          activeCat = slug;
          wrap.querySelectorAll('button').forEach(function (b) {
            var on = b === btn;
            setPillStyles(b, on);
            b.setAttribute('aria-pressed', on ? 'true' : 'false');
          });
          applyFilters();
        });
        wrap.appendChild(btn);
      });

      if (activeCat !== 'all' && categories.indexOf(activeCat) === -1) {
        activeCat = 'all';
        wrap.querySelectorAll('button').forEach(function (b) {
          var on = b === allBtn;
          setPillStyles(b, on);
          b.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
      }
    }

    function setNavLabels() {
      var zh = {
        home: '首页',
        practice: '游戏',
        thinking: '话题',
        work: '职场',
        tools: '工具'
      };
      var en = {
        home: 'Home',
        practice: 'Games',
        thinking: 'Topics',
        work: 'Work',
        tools: 'Tools'
      };
      var map = lang === 'zh' ? zh : en;
      ['home', 'practice', 'thinking', 'work', 'tools'].forEach(function (key) {
        document.querySelectorAll('[data-i18n-nav="' + key + '"]').forEach(function (el) {
          el.textContent = map[key];
        });
      });
    }

    var siteHeaderBound = false;
    function bindSiteHeader() {
      if (siteHeaderBound) return;
      siteHeaderBound = true;
      var drawer = document.getElementById('mobile-drawer');
      var menuBtn = document.getElementById('mobile-menu-btn');
      if (menuBtn && drawer) {
        menuBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          drawer.classList.toggle('hidden');
          menuBtn.setAttribute('aria-expanded', drawer.classList.contains('hidden') ? 'false' : 'true');
        });
        drawer.querySelectorAll('a').forEach(function (a) {
          a.addEventListener('click', function () {
            drawer.classList.add('hidden');
            menuBtn.setAttribute('aria-expanded', 'false');
          });
        });
      }
    }

    function applyChrome() {
      applyNavSiteLinks();
      updateLangSwitcher();

      if (lang === 'zh') {
        document.title = '英语角话题 · Born To Speak';
        document.getElementById('page-title').textContent = '英语角话题';
        document.getElementById('page-desc').textContent =
          '社区讨论存档 — 按类别筛选或搜索标题／简介；点击卡片查看中英文提示与追问。';
        document.getElementById('header-sub').textContent = '话题归档';
        document.getElementById('footer-line').textContent = 'Born To Speak · 讨论归档';
        document.getElementById('loading').textContent = '加载中…';
        document.getElementById('search-label').textContent = '搜索';
        document.getElementById('cat-label').textContent = '类别';
        document.getElementById('topic-search').placeholder = '标题、英文标题、简介或编号…';
        document.getElementById('empty-filter').textContent = '没有符合筛选条件的话题，试试清空搜索或选「全部」。';
      } else {
        document.title = 'Discussion topics · Born To Speak';
        document.getElementById('page-title').textContent = 'English corner topics';
        document.getElementById('page-desc').textContent =
          'Saved from our sessions — filter by category or search titles and blurbs; open a card for prompts.';
        document.getElementById('header-sub').textContent = 'Topics archive';
        document.getElementById('footer-line').textContent = 'Born To Speak · Discussion archive';
        document.getElementById('loading').textContent = 'Loading topics…';
        document.getElementById('search-label').textContent = 'Search';
        document.getElementById('cat-label').textContent = 'Category';
        document.getElementById('topic-search').placeholder = 'Title, intro, category, or id…';
        document.getElementById('empty-filter').textContent =
          'No topics match. Clear the search or choose “All”.';
      }
      setNavLabels();
    }

    applyChrome();
    bindSiteHeader();

    fetch('./topics-archive.json')
      .then(function (r) {
        if (!r.ok) throw new Error('Could not load topics-archive.json');
        return r.json();
      })
      .then(function (topics) {
        document.getElementById('loading').classList.add('hidden');
        topics.sort(function (a, b) {
          return a.id - b.id;
        });
        allTopics = topics;

        document.getElementById('toolbar').classList.remove('hidden');
        var searchInput = document.getElementById('topic-search');
        searchInput.value = filterQ;

        var cats = buildCategoryList(topics);
        if (activeCat !== 'all' && cats.indexOf(activeCat) === -1) activeCat = 'all';

        renderCategoryPills(cats);

        searchInput.addEventListener('input', function () {
          applyFilters();
        });
        searchInput.addEventListener('search', function () {
          applyFilters();
        });

        applyFilters();

        applyChrome();
      })
      .catch(function (e) {
        document.getElementById('loading').classList.add('hidden');
        var err = document.getElementById('error');
        err.textContent = e.message || 'Failed to load topics.';
        err.classList.remove('hidden');
      });
  </script>
</body>
</html>
